[env:sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    ; Each host subscribes ~5 HID characteristics; the default 8 CCCDs made
    ; NimBLE evict the oldest bond as soon as a second host paired.
    -DCONFIG_BT_NIMBLE_MAX_BONDS=8
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=40
lib_deps =
    m5stack/M5Unified
    h2zero/NimBLE-Arduino@^2.1.0
